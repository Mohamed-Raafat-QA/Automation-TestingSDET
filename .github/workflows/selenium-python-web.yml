name: selenium-python-web
'on':
  push:
    paths:
    - selenium-python-web/**
    - .github/workflows/selenium-python-web.yml
  pull_request:
    paths:
    - selenium-python-web/**
    - .github/workflows/selenium-python-web.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: selenium-python-web/requirements.txt
    - name: Install Python dependencies
      run: python -m pip install -r requirements.txt
    - uses: browser-actions/setup-chrome@v2
      id: chrome
      with:
        chrome-version: stable
        install-chromedriver: true
    - name: Run all scenarios
      env:
        CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
      run: python -m pytest
    - name: Upload test evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: web-reports
        path: selenium-python-web/reports/
        if-no-files-found: warn
        retention-days: 7
defaults:
  run:
    working-directory: selenium-python-web
