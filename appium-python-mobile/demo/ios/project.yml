name: ParcelDesk
options:
  deploymentTarget:
    iOS: '16.0'
targets:
  ParcelDesk:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.parceldesk
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1,2'
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: '1.0'
